<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/employee}">
<head><title>Announcements</title></head>
<body>
<div layout:fragment="content">
  <div class="ph"><h1>Announcements</h1><p>Company notices and updates</p></div>
  <div th:if="${!#lists.isEmpty(announcements)}" class="ag">
    <div th:each="a : ${announcements}"
         th:classappend="${a.priority.name() == 'URGENT'} ? ' ur' : (${a.priority.name() == 'IMPORTANT'} ? ' im' : (${a.priority.name() == 'HR_UPDATE'} ? ' hr' : ''))"
         class="ac">
      <div class="at" th:text="${a.title}"></div>
      <div class="am">
        <span th:if="${a.priority.name() == 'URGENT'}" class="badge br">&#x1F6A8; Urgent</span>
        <span th:if="${a.priority.name() == 'IMPORTANT'}" class="badge by">&#x26A0; Important</span>
        <span th:if="${a.priority.name() == 'HR_UPDATE'}" class="badge bp">HR Update</span>
        <span th:if="${a.priority.name() == 'NORMAL'}" class="badge bk">Normal</span>
        <span class="badge bb" th:text="${a.audience}"></span>
        <span style="font-size:12px;color:#94a3b8;" th:text="${a.postDate}"></span>
        <span th:if="${a.postedBy != null}" style="font-size:12px;color:#94a3b8;" th:text="|by ${a.postedBy}|"></span>
      </div>
      <div class="ab" th:text="${a.message}"></div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(announcements)}" class="empty"><p>No announcements at the moment</p></div>
</div>
</body>
</html>
