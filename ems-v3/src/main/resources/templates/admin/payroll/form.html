<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head><title>Create Payroll</title></head>
<body>
<div layout:fragment="content">
  <div class="ph"><h1>Create Payroll Record</h1><p>Generate payroll for an employee</p></div>
  <div class="card">
    <form id="payForm" th:action="@{/admin/payroll/save}" method="post" novalidate>
      <div class="fg">
        <div class="fi">
          <label>Employee *</label>
          <select class="fc" name="employeeId" required onchange="autoFill(this)">
            <option value="">— Select Employee —</option>
            <option th:each="e : ${employees}"
                    th:value="${e.id}"
                    th:text="${e.fullName + ' — ' + (e.department != null ? e.department.name : 'No Dept')}"
                    th:data-salary="${e.basicSalary ?: 0}"></option>
          </select>
        </div>
        <div class="fi">
          <label>Month *</label>
          <select class="fc" name="payrollMonth" required>
            <option value="">— Select Month —</option>
            <option value="1">January</option><option value="2">February</option><option value="3">March</option>
            <option value="4">April</option><option value="5">May</option><option value="6">June</option>
            <option value="7">July</option><option value="8">August</option><option value="9">September</option>
            <option value="10">October</option><option value="11">November</option><option value="12">December</option>
          </select>
        </div>
        <div class="fi">
          <label>Year *</label>
          <input class="fc" type="number" name="payrollYear" value="2025" required
                 data-year min="2000" max="2100">
        </div>
        <div class="fi">
          <label>Basic Salary (&#x20B9;) *</label>
          <input class="fc" id="basicSalary" type="number" step="0.01" name="basicSalary" required
                 data-positive data-positive-msg="Salary must be greater than 0"
                 oninput="calcNet()" min="0.01">
        </div>
        <div class="fi">
          <label>Allowances (&#x20B9;)</label>
          <input class="fc" id="allowances" type="number" step="0.01" name="allowances" value="0"
                 min="0" oninput="calcNet()">
        </div>
        <div class="fi">
          <label>Deductions (&#x20B9;)</label>
          <input class="fc" id="deductions" type="number" step="0.01" name="deductions" value="0"
                 min="0" oninput="calcNet()">
        </div>
        <div class="fi">
          <label>Payment Method</label>
          <select class="fc" name="paymentMethod">
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Cash">Cash</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>
        <div class="fi">
          <label>Status</label>
          <select class="fc" name="status">
            <option value="PENDING">Pending</option>
            <option value="PAID">Paid</option>
          </select>
        </div>
      </div>
      <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:14px 16px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:14px;font-weight:600;color:#92400e;">Calculated Net Pay:</span>
        <span id="netPreview" style="font-size:22px;font-weight:800;color:#f97316;">&#x20B9;0</span>
      </div>
      <div class="ff">
        <button class="btn btn-p" type="submit">&#x2713; Create Payroll</button>
        <a th:href="@{/admin/payroll}" class="btn btn-o">Cancel</a>
      </div>
    </form>
  </div>
  <script th:src="@{/js/validate.js}"></script>
  <script>
    function autoFill(sel){ const o=sel.options[sel.selectedIndex]; document.getElementById('basicSalary').value=o.getAttribute('data-salary')||0; calcNet(); }
    const form = document.getElementById('payForm');
    emsLive(form);
    form.addEventListener('submit', function(e){
      if(!emsValidate(form)) e.preventDefault();
    });
  </script>
</div>
</body>
</html>
